<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summarize Text | News Summarizer</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='summarize.css') }}">
</head>

<body class="dark-theme">
  <!-- ===================== NAVBAR ===================== -->
  <nav class="navbar navbar-expand-lg glass-nav py-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">📰 News Summarizer</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" title="Toggle Menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav nav-links">
          <li class="nav-item"><a href="/" class="nav-link active">Home</a></li>
          <li class="nav-item"><a href="/news" class="nav-link">Search News</a></li>
          <li class="nav-item"><a href="/url" class="nav-link">From URL</a></li>
        </ul>

        <!-- Theme toggle -->
        <button id="themeToggle" class="theme-toggle ms-4" title="Toggle Theme">🌙</button>
      </div>
    </div>
  </nav>

  <!-- ===================== MAIN CONTENT ===================== -->
  <section class="summarize-page container text-center mt-5">
    <div class="glass-card mx-auto p-4">
      <h1 class="mb-4 text-gradient">Summarize Your Text</h1>

      <form method="POST" action="/summarize" onsubmit="showLoader()">
        <textarea name="text" rows="8" class="form-control custom-textarea mb-4"
          placeholder="Paste your article or paragraph here..." required></textarea>

        <!-- Language Selector & Audio -->
        <div class="row align-items-center g-3 mb-4">
          <div class="col-md-5">
            <label for="language-select" class="form-label text-light">Choose Language:</label>
            <select id="language-select" name="language" class="form-select custom-select" required
                    title="Select language for summary output">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="mr">Marathi</option>
              <option value="te">Telugu</option>
              <option value="bho">Bhojpuri</option>
            </select>
          </div>

          <div class="col-md-7">
            {% if audio_file %}
            <div class="audio-container">
              <audio controls class="custom-audio">
                <source src="{{ url_for('static', filename='summary.mp3') }}" type="audio/mpeg">
                Your browser does not support the audio element.
              </audio>
            </div>
            {% endif %}
          </div>
        </div>

        <button type="submit" class="btn-glow">✨ Generate Summary</button>
      </form>

      <!-- Loader -->
      <div id="loader" class="loader-overlay" style="display: none;">
        <div class="loader"></div>
        <p class="loader-text">Generating your summary...</p>
      </div>

      <!-- Summary Output -->
      {% if summary %}
      <div class="summary-box mt-4 p-3">
        <h5>🧠 Generated Summary</h5>
        <p>{{ summary }}</p>
      </div>
      {% endif %}
    </div>
  </section>

  <footer class="text-center py-3 mt-5 footer-glass">
    &copy; 2025 News Summarizer | Made with ❤️ using Flask & Bootstrap
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script>
    // Loader
    function showLoader() {
      document.getElementById("loader").style.display = "flex";
    }

    // Theme toggle
    const toggle = document.getElementById("themeToggle");
    const body = document.body;

    toggle.addEventListener("click", () => {
      body.classList.toggle("light-theme");
      body.classList.toggle("dark-theme");
      toggle.textContent = body.classList.contains("dark-theme") ? "🌙" : "☀️";
    });
  </script>
</body>
</html>
